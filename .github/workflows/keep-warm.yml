name: Keep MCP connector warm

# Pings the Vantage MCP server's health endpoint on a schedule so Render's
# free instance doesn't spin down (it sleeps after ~15 min with no inbound
# traffic). Runs on GitHub's servers — independent of any local machine or
# whether Claude is connected. This is a free backstop; a dedicated uptime
# monitor (UptimeRobot, every 5 min) is the more punctual primary.

on:
  schedule:
    # Every 10 minutes. GitHub cron can be delayed a few minutes under load,
    # which still stays comfortably under Render's ~15-min idle window.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# Don't pile up runs if one is slow.
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoints
        run: |
          set -u
          urls=(
            "https://the-vantage-media.onrender.com/health"
            "https://mcp.thevantage.media/health"
          )
          ok=0
          for url in "${urls[@]}"; do
            echo "Pinging $url"
            # --retry handles the cold-start wake (first hit can take 30-60s).
            if curl -fsS --max-time 75 --retry 4 --retry-delay 12 --retry-connrefused "$url" -o /dev/null; then
              echo "  ✓ awake: $url"
              ok=1
            else
              echo "  ! no response (will rely on the other URL / next run): $url"
            fi
          done
          # Never fail the workflow on a single miss — avoids noisy failure emails.
          if [ "$ok" -eq 1 ]; then
            echo "Connector is warm."
          else
            echo "::warning::No health endpoint responded this run."
          fi
