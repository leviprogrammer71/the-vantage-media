# Deploy blueprint for Render (render.com) — Node web service.
#
# IMPORTANT: this server lives in the `vantage-mcp-server/` SUBFOLDER of the
# repo. Render must build/run from there, NOT the repo root (the root is the
# Vite website and has no `start` script — that's what caused the failed deploy).
services:
  - type: web
    name: vantage-mcp-server
    runtime: node
    rootDir: vantage-mcp-server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TRANSPORT
        value: http
      - key: VANTAGE_SUPABASE_URL
        value: https://tsvmyjxnvdrwcdesiewv.supabase.co
      - key: VANTAGE_SUPABASE_ANON_KEY
        sync: false   # set in dashboard (public anon key)
      - key: VANTAGE_SUPABASE_SERVICE_ROLE_KEY
        sync: false   # SECRET — set in dashboard, never commit
